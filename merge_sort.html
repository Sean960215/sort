<body>
    <a href="index.html" class="back-button">
        <span>←</span>
        <span>返回首頁</span>
    </a>
    <div class="container">
        <div class="header">
            <h1>🔀 合併排序視覺化</h1>
            <p>互動式排序算法教學 - 逐步了解合併排序的工作原理</p>
        </div>

        <div class="main-content">
            <!-- 左侧：數據輸入面板 -->
            <div class="panel">
                <h2>📊 數據設置</h2>

                <div class="description">
                    合併排序採用分治策略，將數組遞迴分割後再合併，時間複雜度為 O(n log n)。
                </div>

                <div class="input-group">
                    <label>選擇數據數量</label>
                    <div class="slider-with-value">
                        <input type="range" id="quantitySlider" min="5" max="64" value="16">
                        <span class="slider-value"><span id="quantityValue">16</span> 個</span>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-primary btn-small" id="generateRandomBtn">🎲 隨機生成</button>
                    <button class="btn-info btn-small" id="generateSortedBtn">✓ 已排序</button>
                    <button class="btn-warning btn-small" id="generateReverseBtn">✗ 逆序</button>
                </div>

                <div class="input-group" style="margin-top: 10px;">
                    <label>或輸入自訂數據（逗號分隔）</label>
                    <textarea id="customData" placeholder="例如: 45, 23, 51, 12, 89, 34">45, 23, 51, 12, 89, 34</textarea>
                </div>

                <div class="button-group">
                    <button class="btn-success" id="loadCustomBtn">📥 加載自訂數據</button>
                </div>

                <div class="input-group" style="margin-top: 10px;">
                    <label>播放速度</label>
                    <div class="slider-with-value">
                        <input type="range" id="speedSlider" min="1" max="100" value="30">
                        <span class="slider-value" id="speedDisplay">30</span>
                    </div>
                </div>
            </div>

            <!-- 右侧：控制面板 -->
            <div class="panel">
                <h2>⚙️ 排序控制</h2>

                <div class="controls">
                    <button class="btn-success" id="playBtn">▶ 播放</button>
                    <button class="btn-warning" id="pauseBtn">⏸ 暫停</button>
                    <button class="btn-info" id="stepBtn">👣 單步執行</button>
                    <button class="btn-info" id="nextBtn">⏭ 下一步</button>
                    <button class="btn-primary" id="prevBtn">⏮ 上一步</button>
                </div>

                <button class="btn-primary" style="width: 100%; margin-bottom: 10px;" id="resetBtn">🔄 重置</button>

                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">比較次數</div>
                        <div class="stat-value" id="comparisons">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">合併次數</div>
                        <div class="stat-value" id="merges">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">遞迴深度</div>
                        <div class="stat-value" id="depth">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">狀態</div>
                        <div class="stat-value" id="status" style="font-size: 1em;">就緒</div>
                    </div>
                </div>

                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #667eea;"></div>
                        <span>未排序</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffc107;"></div>
                        <span>比較</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff6b6b;"></div>
                        <span>合併</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #51cf66;"></div>
                        <span>已排序</span>
                    </div>
                </div>
            </div>

            <!-- 可視化窗格 -->
            <div class="panel visualization-panel">
                <h2>📈 動畫展示</h2>

                <div class="step-info">
                    <div id="stepDisplay">準備就緒，請選擇數據並開始排序</div>
                </div>

                <div class="canvas-container">
                    <canvas id="canvas" width="900" height="280"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stepBtn = document.getElementById('stepBtn');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const resetBtn = document.getElementById('resetBtn');
        const quantitySlider = document.getElementById('quantitySlider');
        const quantityValue = document.getElementById('quantityValue');
        const generateRandomBtn = document.getElementById('generateRandomBtn');
        const generateSortedBtn = document.getElementById('generateSortedBtn');
        const generateReverseBtn = document.getElementById('generateReverseBtn');
        const customDataTextarea = document.getElementById('customData');
        const loadCustomBtn = document.getElementById('loadCustomBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedDisplay = document.getElementById('speedDisplay');
        const comparisonsDisplay = document.getElementById('comparisons');
        const mergesDisplay = document.getElementById('merges');
        const depthDisplay = document.getElementById('depth');
        const statusDisplay = document.getElementById('status');
        const stepDisplay = document.getElementById('stepDisplay');

        let originalArray = [];
        let array = [];
        let sorting = false;
        let playing = false;
        let comparisons = 0;
        let merges = 0;
        let maxDepth = 0;
        let speed = 30;
        let currentStepIndex = 0;
        let sortingSteps = [];
        let highlightedIndices = [];
        let mergeIndices = [];

        // 初始化數組
        function initArray() {
            const quantity = parseInt(quantitySlider.value);
            originalArray = [];
            for (let i = 0; i < quantity; i++) {
                originalArray.push(Math.random() * 1000);
            }
            resetSort();
        }

        // 生成隨機數據
        function generateRandom() {
            initArray();
        }

        // 生成已排序數據
        function generateSorted() {
            const quantity = parseInt(quantitySlider.value);
            originalArray = [];
            for (let i = 0; i < quantity; i++) {
                originalArray.push((i + 1) * (1000 / quantity));
            }
            resetSort();
        }

        // 生成逆序數據
        function generateReverse() {
            const quantity = parseInt(quantitySlider.value);
            originalArray = [];
            for (let i = quantity; i > 0; i--) {
                originalArray.push(i * (1000 / quantity));
            }
            resetSort();
        }

        // 加載自訂數據
        function loadCustomData() {
            const dataStr = customDataTextarea.value.trim();
            if (!dataStr) {
                alert('請輸入數據');
                return;
            }

            try {
                originalArray = dataStr.split(',').map(x => {
                    const num = parseFloat(x.trim());
                    if (isNaN(num)) throw new Error('無效數據');
                    return num;
                });

                if (originalArray.length === 0) {
                    alert('請輸入至少一個數據');
                    return;
                }

                quantitySlider.value = originalArray.length;
                quantityValue.textContent = originalArray.length;
                resetSort();
            } catch (err) {
                alert('數據格式錯誤：' + err.message);
            }
        }

        // 重置排序
        function resetSort() {
            array = [...originalArray];
            comparisons = 0;
            merges = 0;
            maxDepth = 0;
            currentStepIndex = 0;
            sorting = false;
            playing = false;
            sortingSteps = [];
            highlightedIndices = [];
            mergeIndices = [];
            comparisonsDisplay.textContent = '0';
            mergesDisplay.textContent = '0';
            depthDisplay.textContent = '0';
            statusDisplay.textContent = '就緒';
            stepDisplay.innerHTML = `<strong>準備就緒</strong><br><small>點擊「播放」自動排序，或「單步執行」逐步查看</small>`;
            playBtn.disabled = false;
            pauseBtn.disabled = true;
            stepBtn.disabled = false;
            nextBtn.disabled = false;
            prevBtn.disabled = true;
            draw();
        }

        function ensureSortingSteps() {
            if (sortingSteps.length === 0) {
                generateSortingSteps();
                sorting = true;
            }
        }

        function stepForward() {
            if (playing) {
                return;
            }

            ensureSortingSteps();

            if (currentStepIndex < sortingSteps.length - 1) {
                currentStepIndex++;
                updateStep(currentStepIndex);
            }

            if (currentStepIndex === sortingSteps.length - 1) {
                statusDisplay.textContent = '完成！';
            }
        }

        // 生成所有排序步驟
        function generateSortingSteps() {
            const tempArray = [...originalArray];
            sortingSteps = [
                {
                    array: [...tempArray],
                    comparisons: 0,
                    merges: 0,
                    depth: 0,
                    highlighted: [],
                    merging: [],
                    sorted: [],
                    step: '準備開始合併排序',
                    details: `共有 ${tempArray.length} 個元素，將進行遞迴分割`
                }
            ];

            let totalComparisons = 0;
            let totalMerges = 0;
            let currentDepth = 0;
            let sortedIndices = [];

            // 合併排序的遞迴步驟生成
            function generateMergeSteps(left, right, depth) {
                currentDepth = Math.max(currentDepth, depth);

                if (left === right) {
                    sortingSteps.push({
                        array: [...tempArray],
                        comparisons: totalComparisons,
                        merges: totalMerges,
                        depth: depth,
                        highlighted: [left],
                        merging: [],
                        sorted: [...sortedIndices],
                        step: `深度 ${depth} - 分割完成：單個元素 [${left}]`,
                        details: `值: ${tempArray[left].toFixed(1)}`
                    });
                    return;
                }

                const mid = Math.floor((left + right) / 2);

                // 分割左半部分
                sortingSteps.push({
                    array: [...tempArray],
                    comparisons: totalComparisons,
                    merges: totalMerges,
                    depth: depth,
                    highlighted: [],
                    merging: [],
                    sorted: [...sortedIndices],
                    step: `深度 ${depth} - 分割左半部分 [${left}...${mid}]`,
                    details: `範圍: ${left} 到 ${mid}`
                });

                generateMergeSteps(left, mid, depth + 1);

                // 分割右半部分
                sortingSteps.push({
                    array: [...tempArray],
                    comparisons: totalComparisons,
                    merges: totalMerges,
                    depth: depth,
                    highlighted: [],
                    merging: [],
                    sorted: [...sortedIndices],
                    step: `深度 ${depth} - 分割右半部分 [${mid + 1}...${right}]`,
                    details: `範圍: ${mid + 1} 到 ${right}`
                });

                generateMergeSteps(mid + 1, right, depth + 1);

                // 合併過程
                let left_idx = left;
                let right_idx = mid + 1;
                let merged = [];

                while (left_idx <= mid && right_idx <= right) {
                    totalComparisons++;

                    sortingSteps.push({
                        array: [...tempArray],
                        comparisons: totalComparisons,
                        merges: totalMerges,
                        depth: depth,
                        highlighted: [left_idx, right_idx],
                        merging: [],
                        sorted: [...sortedIndices],
                        step: `深度 ${depth} - 比較 [${left_idx}] 和 [${right_idx}]`,
                        details: `值: ${tempArray[left_idx].toFixed(1)} vs ${tempArray[right_idx].toFixed(1)}`
                    });

                    if (tempArray[left_idx] <= tempArray[right_idx]) {
                        merged.push(tempArray[left_idx]);
                        left_idx++;
                    } else {
                        merged.push(tempArray[right_idx]);
                        right_idx++;
                    }
                }

                while (left_idx <= mid) {
                    merged.push(tempArray[left_idx]);
                    left_idx++;
                }

                while (right_idx <= right) {
                    merged.push(tempArray[right_idx]);
                    right_idx++;
                }

                // 將合併結果放回
                for (let i = 0; i < merged.length; i++) {
                    tempArray[left + i] = merged[i];
                }

                totalMerges++;

                const mergeRange = Array.from({length: right - left + 1}, (_, i) => left + i);
                sortingSteps.push({
                    array: [...tempArray],
                    comparisons: totalComparisons,
                    merges: totalMerges,
                    depth: depth,
                    highlighted: [],
                    merging: mergeRange,
                    sorted: [...sortedIndices],
                    step: `深度 ${depth} - 合併完成 [${left}...${right}]`,
                    details: `已合併 ${merged.length} 個元素`
                });
            }

            generateMergeSteps(0, tempArray.length - 1, 0);

            // 全部排序完成
            sortedIndices = Array.from({length: tempArray.length}, (_, i) => i);
            sortingSteps.push({
                array: [...tempArray],
                comparisons: totalComparisons,
                merges: totalMerges,
                depth: currentDepth,
                highlighted: [],
                merging: [],
                sorted: sortedIndices,
                step: '🎉 排序完成！',
                details: `已比較 ${totalComparisons} 次，执行了 ${totalMerges} 次合併，遞迴深度: ${currentDepth}`
            });
        }

        // 繪製數組
        function draw(highlighted = [], merging = [], sorted = []) {
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = canvas.width / array.length;
            const maxValue = Math.max(...array);

            for (let i = 0; i < array.length; i++) {
                const barHeight = (array[i] / maxValue) * (canvas.height - 30);
                const x = i * barWidth;
                const y = canvas.height - barHeight - 15;

                // 設定顏色
                let color = '#667eea'; // 預設藍色
                if (merging.includes(i)) {
                    color = '#ff6b6b'; // 紅色 - 合併
                } else if (highlighted.includes(i)) {
                    color = '#ffc107'; // 黃色 - 比較
                } else if (sorted.includes(i)) {
                    color = '#51cf66'; // 綠色 - 已排序
                }

                // 繪製條形
                ctx.fillStyle = color;
                ctx.fillRect(x + 2, y, barWidth - 4, barHeight);

                // 繪製邊框
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x + 2, y, barWidth - 4, barHeight);
            }
        }

        // 更新當前步驟顯示
        function updateStep(stepIndex) {
            if (stepIndex >= 0 && stepIndex < sortingSteps.length) {
                const step = sortingSteps[stepIndex];
                array = [...step.array];
                comparisons = step.comparisons;
                merges = step.merges;
                maxDepth = step.depth;
                comparisonsDisplay.textContent = comparisons;
                mergesDisplay.textContent = merges;
                depthDisplay.textContent = maxDepth;
                statusDisplay.textContent = '教學中';

                let displayText = `<strong>${step.step}</strong>`;
                if (step.details) {
                    displayText += `<br><small style="color: #666;">📌 ${step.details}</small>`;
                }
                stepDisplay.innerHTML = displayText;

                draw(step.highlighted, step.merging, step.sorted);

                // 更新按鈕狀態
                prevBtn.disabled = stepIndex === 0;
                nextBtn.disabled = stepIndex === sortingSteps.length - 1;
                stepBtn.disabled = stepIndex === sortingSteps.length - 1;
            }
        }

        // 延遲函數
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 自動播放
        async function autoPlay() {
            playing = true;
            playBtn.disabled = true;
            pauseBtn.disabled = false;
            stepBtn.disabled = true;
            nextBtn.disabled = true;
            prevBtn.disabled = true;

            while (currentStepIndex < sortingSteps.length - 1 && playing) {
                currentStepIndex++;
                updateStep(currentStepIndex);
                // 速度公式：最慢2秒，最快0.1秒
                await sleep(2100 - speed * 20);
            }

            if (currentStepIndex === sortingSteps.length - 1) {
                statusDisplay.textContent = '完成！';
            }
            playing = false;
            playBtn.disabled = false;
            pauseBtn.disabled = true;
            prevBtn.disabled = currentStepIndex === 0;
            nextBtn.disabled = currentStepIndex === sortingSteps.length - 1;
            stepBtn.disabled = currentStepIndex === sortingSteps.length - 1;
        }

        // 事件監聽
        quantitySlider.addEventListener('input', (e) => {
            quantityValue.textContent = e.target.value;
        });

        generateRandomBtn.addEventListener('click', generateRandom);
        generateSortedBtn.addEventListener('click', generateSorted);
        generateReverseBtn.addEventListener('click', generateReverse);
        loadCustomBtn.addEventListener('click', loadCustomData);

        playBtn.addEventListener('click', () => {
            if (!playing) {
                ensureSortingSteps();
                autoPlay();
            }
        });

        pauseBtn.addEventListener('click', () => {
            playing = false;
            pauseBtn.disabled = true;
            playBtn.disabled = false;
            prevBtn.disabled = currentStepIndex === 0;
            nextBtn.disabled = currentStepIndex === sortingSteps.length - 1;
            stepBtn.disabled = currentStepIndex === sortingSteps.length - 1;
        });

        stepBtn.addEventListener('click', () => {
            stepForward();
        });

        nextBtn.addEventListener('click', () => {
            stepForward();
        });

        prevBtn.addEventListener('click', () => {
            if (!playing && currentStepIndex > 0) {
                currentStepIndex--;
                updateStep(currentStepIndex);
            }
        });

        resetBtn.addEventListener('click', resetSort);

        speedSlider.addEventListener('input', (e) => {
            speed = parseInt(e.target.value);
            speedDisplay.textContent = speed;
        });

        // 初始化
        initArray();
    </script>
</body>
</html>
